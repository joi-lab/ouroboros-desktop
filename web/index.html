<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ouroboros</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/settings.css">
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <script src="/static/chart.umd.min.js"></script>
    <script src="/static/marked.min.js"></script>
    <script src="/static/purify.min.js"></script>
</head>
<body>
    <div id="app">
        <nav id="nav-rail">
            <div id="nav-logo"></div>
            <button id="nav-collapse-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true">
                <span class="nav-brand-mark" aria-hidden="true"></span>
                <span class="nav-brand-title">Уроборос</span>
                <img class="nav-collapse-icon" src="/static/figma-icons/panel-collapse.svg" alt="">
            </button>
            <button class="nav-btn active" data-page="chat" title="Chat">
                <img class="nav-icon" src="/static/figma-icons/chat.svg" alt="">
                <span>Chat</span>
            </button>
            <button class="nav-btn" data-page="files" title="Files">
                <img class="nav-icon" src="/static/figma-icons/files.svg" alt="">
                <span>Files</span>
            </button>

            <button class="nav-btn" data-page="skills" title="Skills">
                <img class="nav-icon" src="/static/figma-icons/skills.svg" alt="">
                <span>Skills</span>
            </button>
            <button class="nav-btn" data-page="dashboard" title="Dashboard">
                <img class="nav-icon" src="/static/figma-icons/logs.svg" alt="">
                <span>Dashboard</span>
            </button>
            <button class="nav-btn" data-page="settings" title="Settings">
                <img class="nav-icon" src="/static/figma-icons/settings.svg" alt="">
                <span>Settings</span>
                <span class="chat-budget-pill nav-budget-pill" id="chat-budget-pill" role="button" tabindex="0" title="Open budget controls" aria-label="Open budget controls">
                    <span class="chat-budget-text" id="chat-budget-text">$0 / $0</span>
                    <span class="chat-budget-bar">
                        <span class="chat-budget-bar-fill" id="chat-budget-bar-fill"></span>
                    </span>
                </span>
            </button>
            <div class="nav-section-divider"></div>
            <section id="nav-widgets-section" class="nav-widgets-section" aria-label="Widgets">
                <div class="nav-section-title">Widgets</div>
                <div id="nav-widget-list" class="nav-widget-list">
                    <div class="nav-widget-empty">No widgets</div>
                </div>
            </section>
            <div class="nav-spacer"></div>
            <span id="nav-version"></span>
        </nav>
        <div id="divider"></div>
        <main id="content">
            <!-- Pages injected by JS -->
        </main>
    </div>
    <div id="reconnect-overlay">
        <div class="spinner"></div>
        <div>Reconnecting to Ouroboros...</div>
    </div>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
